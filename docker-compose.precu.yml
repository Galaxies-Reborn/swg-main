name: swg-precu

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: swg-precu-oracle
    environment:
      ORACLE_PASSWORD: swg
      APP_USER: swg
      APP_USER_PASSWORD: swg
    ports:
      - "127.0.0.1:1522:1521"
    volumes:
      - swg-precu-oracle-data:/opt/oracle/oradata
    networks:
      - swg-precu-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  swg-precu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: swg-precu-server:local
    container_name: swg-precu
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SWG_DB_HOST: oracle
      SWG_DB_PORT: "1521"
      SWG_DB_SERVICE: XEPDB1
      SWG_DB_USER: swg
      SWG_DB_PASSWORD: swg
      SWG_DB_ADMIN_USER: system
      SWG_DB_ADMIN_PASSWORD: swg
      SWG_DB_DATAFILE_DIR: /opt/oracle/oradata/XE/XEPDB1
      SWG_CLUSTER_NAME: swg
      SWG_PUBLIC_ADDRESS: ${SWG_PRECU_PUBLIC_ADDRESS:-127.0.0.1}
      SWG_PUBLIC_CONNECTION_PORT: ${SWG_PRECU_PUBLIC_CONNECTION_PORT:-45463}
      SWG_SYNC_SOURCE: ${SWG_PRECU_SYNC_SOURCE:-auto}
      SWG_SOURCE_DIR: /swg-precu-source
      SWG_WORK_DIR: /swg-precu
      SWG_CLIENT_ASSETS_TRE: /client-assets/swgsource_3.0.tre
    ports:
      - "45450-45465:44450-44465/tcp"
      - "45450-45465:44450-44465/udp"
      - "5100-5101:5000-5001/tcp"
      - "5100-5101:5000-5001/udp"
    volumes:
      - ${SWG_PRECU_SOURCE_DIR:-E:/SWG/SWGSource/Staging/swg-precu-runtime-source}:/swg-precu-source:ro
      - ${SWG_PRECU_ASSETS_DIR:-../pre-cu-reborn-assets}:/client-assets:ro
      - swg-precu-work:/swg-precu
    networks:
      - swg-precu-net
    working_dir: /swg-precu
    command: ["run"]
    tty: true
    stdin_open: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pgrep -f '[b]in/LoginServer' >/dev/null &&
          pgrep -f '[b]in/TaskManager' >/dev/null &&
          pgrep -f '[b]in/ConnectionServer' >/dev/null &&
          pgrep -f '[b]in/SwgDatabaseServer' >/dev/null &&
          pgrep -f '[b]in/SwgGameServer' >/dev/null
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45m

volumes:
  swg-precu-oracle-data:
    name: swg-precu-oracle-data
  swg-precu-work:
    name: swg-precu-work

networks:
  swg-precu-net:
    name: swg-precu-net
    driver: bridge
